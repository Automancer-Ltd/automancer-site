name: Uptime

# On-demand production correctness verification. UptimeRobot independently
# checks https://automancer.uk/ from outside this estate, so basic URL
# availability does not depend on this workflow. Sentry's browser SDK captures
# client-side JS errors only.
#
# Runs ops/verify-production.sh — the exact same assertions as the verify
# job in deploy.yml, from one shared script so the two can never drift.
#
# There is deliberately no schedule. The recurring check is the auto-vps user
# timer ops/systemd/user/automancer-site-production-verify.timer, which runs
# this same script every 30 minutes from the reviewed pin and routes a failure
# through OnFailure=alert-email@%n.service into Waseem's daily digest
# (AUT-9926). The cron it replaced was the estate's whole Actions bill, and
# GitHub's shared scheduler never honoured it as a detection window: measured
# 31 Aug 2026 from all 174 scheduled runs, median gap 45.5 minutes, longest
# 12.5 hours. Do not add a schedule back; fix the timer instead.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  # Never cancel an in-flight check: a slow run must finish and report, not
  # vanish because a second dispatch started.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # A healthy site finishes in under a minute (measured: 9-45s across the
    # last 20 scheduled runs). The cap bounds a down-site run instead of
    # letting every check burn its full 90s retry budget (~19 min).
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify production serves the site
        run: ops/verify-production.sh https://automancer.uk
