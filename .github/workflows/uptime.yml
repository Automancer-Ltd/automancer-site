name: Uptime

# Scheduled production correctness verification. UptimeRobot independently
# checks https://automancer.uk/ from outside this estate, so basic URL
# availability does not depend on this workflow. Sentry's browser SDK captures
# client-side JS errors only.
#
# Runs ops/verify-production.sh — the exact same assertions as the verify
# job in deploy.yml, from one shared script so the two can never drift.
#
# Human delivery is external to this workflow: auto-vps's live
# ci-alert-check.timer discovers every repository-owned workflow, including
# this scheduled one. A sustained red on automancer-site is routed through the
# estate's alert-email path into Waseem's next daily digest. This is deliberate:
# Gmail contains no past failed-Uptime notice, so GitHub's optional scheduled-
# workflow mail is not treated as the delivery contract.
#
# TRANSITIONAL: keep the cron until the reviewed auto-vps timer has fired on its
# real interval and its failure route to the daily digest is proved. AUT-9908's
# follow-up then removes only schedule, retaining workflow_dispatch.
#
# Cron is UTC. The expression asks for every 30 minutes; GitHub's shared
# scheduler does not honour that as the detection window. Measured 31 Aug 2026
# from all 174 scheduled runs (22 Aug 01:57Z – 31 Aug 00:43Z): median gap
# 45.5 minutes, mean 74.5 minutes, longest 12.5 hours. workflow_dispatch
# allows triggering a check on demand.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  # Never cancel an in-flight check: a slow run must finish and report, not
  # vanish because the next scheduled run started.
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Worst case is every check burning its full 90s retry budget (~19 min);
    # a healthy site finishes in under a minute.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify production serves the site
        run: ops/verify-production.sh https://automancer.uk
