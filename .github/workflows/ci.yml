name: CI
# The pull-request verdict. Pushes to main are re-checked by deploy.yml's build
# job on the merged tree itself, so this workflow never runs on main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # Bound stalled npm registry requests to about two minutes including retries.
  npm_config_fetch_timeout: "20000"
  npm_config_fetch_retries: "4"
  npm_config_fetch_retry_mintimeout: "2000"
  npm_config_fetch_retry_maxtimeout: "10000"

jobs:
  checks:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Run Estate Checks
      uses: Automancer-Ltd/estate-checks@v1
    - name: Scan commit history for secrets
      run: |
        scan_dir=$(mktemp -d)
        trap 'rm -rf "$scan_dir"' EXIT
        curl --fail --silent --show-error --location --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan_dir/gitleaks.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum --check
        tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
        # HEAD excludes unrelated PR refs; -m also scans merge-resolution diffs.
        "$scan_dir/gitleaks" git --redact --config .gitleaks.toml --log-opts="HEAD -m"
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Its self-install runs `npm install`, whose audit call can hang 5 minutes (t6452).
      env:
        npm_config_audit: "false"
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Lint, typecheck, build and test
      run: pnpm run verify
    - name: Install the journey browser
      run: pnpm exec playwright install --with-deps chromium
    - name: Visitor journey (phone and desktop, against the built dist/)
      run: pnpm run journey
    - name: Self-test the production checker
      run: ops/verify-production.sh --self-test
    - name: Self-test the preview target's deploy logic
      run: ops/test-preview-target.sh
