name: CI
# The pull-request verdict. Pushes to main are re-checked by deploy.yml's build
# job on the merged tree itself, so this workflow never runs on main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # Bound stalled npm registry requests to about two minutes including retries.
  npm_config_fetch_timeout: "20000"
  npm_config_fetch_retries: "4"
  npm_config_fetch_retry_mintimeout: "2000"
  npm_config_fetch_retry_maxtimeout: "10000"

jobs:
  checks:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    # Stops a stuck job only; an honest run takes about two minutes. Speed is a
    # target we measure, never a limit that cancels a run.
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    # The checker self-tests read only the scripts and their own fixture
    # servers, and mostly wait on them (about 16 s here, under a second of it
    # computing), so they run beside the steps below; their verdict is
    # collected after the journey (t27546).
    - name: Start the checker self-tests beside the next steps
      run: ops/ci/beside.sh start self-tests sh -c 'ops/verify-production.sh --self-test && ops/test-preview-target.sh'
    - name: Run Estate Checks
      uses: Automancer-Ltd/estate-checks@v1
    - name: Scan commit history for secrets
      run: |
        scan_dir=$(mktemp -d)
        trap 'rm -rf "$scan_dir"' EXIT
        curl --fail --silent --show-error --location --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan_dir/gitleaks.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum --check
        tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
        # HEAD excludes unrelated PR refs; -m also scans merge-resolution diffs.
        "$scan_dir/gitleaks" git --redact --config .gitleaks.toml --log-opts="HEAD -m"
    - name: Set up Node, pnpm and locked dependencies
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        runtime: node@26
        cache: true
        require-lockfile: true
    # The browser alone, from Playwright's CDN. The hosted image already has
    # every library Chromium needs. `--with-deps` added only apt fonts and mesa
    # updates the journey never reads, and the runner's apt mirror often crawled
    # at about 64 kB/s: over 2 minutes in 11 of the 19 pull requests before
    # t25593, up to 10. Nothing before the journey uses it, so it downloads
    # while verify runs (t27546); the timeout guards a stalled download.
    - name: Start downloading the journey browser beside verify
      run: ops/ci/beside.sh start browser timeout 300 pnpm exec playwright install chromium
    - name: Lint, typecheck, build and test
      run: pnpm run verify
    # The release before this one is production: /api/stability.json promises
    # machines that its endpoint paths, operation ids, field names, service ids,
    # page URLs and enum values stay. Fail the pull request that drops one
    # without a deprecation that has run its notice (ops/contract/, t25827).
    - name: Keep every promise production publishes to machines
      timeout-minutes: 3
      run: node ops/contract/check-surface.mjs --baseline=https://automancer.uk --candidate=dist
    - name: Journey browser downloaded
      timeout-minutes: 5
      run: ops/ci/beside.sh wait browser
    - name: Visitor journey (phone and desktop, against the built dist/)
      timeout-minutes: 10
      # The dist/ verify just built and audited, not a second build of it.
      run: pnpm run journey
      env:
        SKIP_BUILD: "1"
    # Reported even when an earlier step failed, so a red run shows every verdict.
    - name: Self-test the production checker and the preview target's deploy logic
      if: ${{ !cancelled() }}
      timeout-minutes: 5
      run: ops/ci/beside.sh wait self-tests
