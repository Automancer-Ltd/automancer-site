name: CI

# Build + typecheck + test on every PR and every push to main. The deploy
# workflow (deploy.yml) is untouched and remains the only path to Pages.
#
# Estate CI rules applied: per-job timeout, concurrency group keyed on the
# ref that cancels superseded runs, push filtered to the default branch so
# branch pushes aren't billed twice alongside their pull_request run.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned version from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      # Builds dist/ once via vitest globalSetup, then audits it.
      - name: Test production build
        run: pnpm run test

  # Prove the production checker can still fail AND pass. ops/verify-production.sh
  # guards both deploy.yml (post-deploy verify) and uptime.yml (cron monitor); if
  # a check inside it silently stops being able to fail, both go quiet at once and
  # still report green. --self-test drives every check against a local fixture on
  # 127.0.0.1 (never production) and asserts each can go red and green. No pnpm or
  # Node needed — just bash, curl, python3 and openssl.
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test the production checker
        run: ops/verify-production.sh --self-test
