name: Deploy to GitHub Pages

# Every push to main builds, deploys and verifies automancer.uk.
#
# There is no CI run on main: a merge can produce a tree no pull request
# tested, so the build job runs the full verdict (`pnpm run verify`) on this
# exact commit before it builds the artifact it ships.
#
# Every `uses:` below is pinned to a full commit SHA, with the human-readable
# version in a trailing comment. Version tags are mutable upstream, so the pin
# is what guarantees this workflow runs the code we reviewed - it holds
# `pages: write` and `id-token: write`. Dependabot's github-actions ecosystem
# (.github/dependabot.yml) refreshes both the SHA and the comment.
on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token is granted to the deploy job alone: build runs `pnpm install` and
# the site build (third-party code), which must not be able to mint an OIDC token.
permissions:
  contents: read
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Its self-install runs `npm install`, whose audit call can hang 5 minutes (t6452).
        env:
          npm_config_audit: "false"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, build and test this commit
        run: pnpm run verify

      - name: Build
        run: pnpm run build
        # Sourced from the repository Actions variable (populated from BWS
        # AUT_SENTRY_WEB_DSN). Astro/Vite only exposes PUBLIC_* values to the
        # browser bundle, so this makes production Pages builds observable
        # without placing a DSN in the repository or local dotenv files.
        # The release tags each Sentry event with the commit that served it.
        env:
          PUBLIC_AUT_SENTRY_WEB_DSN: ${{ vars.PUBLIC_AUT_SENTRY_WEB_DSN }}
          PUBLIC_SENTRY_RELEASE: ${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          # The action drops dot-prefixed paths by default, which is why
          # /.well-known/ answered 404 in production. GitHub Pages serves them.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    # A healthy deploy and verify finish in under a minute. The cap bounds a
    # down-site run instead of letting every check burn its 90s retry budget.
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Verification against PRODUCTION ITSELF: deploy-pages only proves GitHub
      # accepted the artifact. This fails the run unless every page answers,
      # unknown paths are a real 404, the machine surfaces and legal footer are
      # served, TLS is valid, and production serves this run's exact revision.
      # The assertions are shared with the 30-minute host monitor (docs/DEPLOYMENT.md).
      - name: Verify production serves the new deploy
        run: ops/verify-production.sh --expected-revision "$GITHUB_SHA" https://automancer.uk
