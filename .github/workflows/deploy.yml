name: Deploy to GitHub Pages

# Builds the Astro site and deploys it via the GitHub Pages Actions flow
# (actions/deploy-pages), NOT the legacy branch-based Pages build.
#
# Trigger is intentionally push-to-main only, so this workflow is inert on
# every other branch (including relaunch) until this branch is merged.
# IMPORTANT: the repo's Settings > Pages > Source must be switched from
# "Deploy from a branch" to "GitHub Actions" for this workflow to take
# over Pages serving — see the relaunch PR description for details. Until
# that switch happens, this workflow will build and upload an artifact
# but Pages will keep serving the legacy branch-based build.
#
# Every `uses:` below is pinned to a full commit SHA, with the human-readable
# version in a trailing comment. Version tags are mutable upstream, so the pin
# is what guarantees this workflow runs the code we reviewed - it holds
# `pages: write` and `id-token: write`. Dependabot's github-actions ecosystem
# (.github/dependabot.yml) refreshes both the SHA and the comment weekly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        # Sourced from the repository Actions variable (populated from BWS
        # AUT_SENTRY_WEB_DSN). Astro/Vite only exposes PUBLIC_* values to the
        # browser bundle, so this makes production Pages builds observable
        # without placing a DSN in the repository or local dotenv files.
        env:
          PUBLIC_AUT_SENTRY_WEB_DSN: ${{ vars.PUBLIC_AUT_SENTRY_WEB_DSN }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Post-deploy verification against PRODUCTION ITSELF. deploy-pages only
  # proves GitHub accepted the artifact; a build that emitted broken or empty
  # pages would otherwise go green and stay green. This job fails the whole
  # run unless every page answers, unknown paths are a real 404, llms.txt and
  # the sitemap exist, the legal footer anchor is served, the TLS certificate
  # is valid, and production serves this run's exact build revision.
  #
  # The assertions live in ops/verify-production.sh — shared verbatim with
  # uptime.yml so the two can never drift apart. No continue-on-error here:
  # this job is mandatory, a red verify means a red release.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    # Worst case is every check burning its full 90s retry budget (~19 min);
    # a healthy deploy finishes this job in under a minute.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify production serves the new deploy
        run: ops/verify-production.sh --expected-revision "$GITHUB_SHA" https://automancer.uk
