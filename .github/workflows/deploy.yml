name: Deploy to GitHub Pages

# Every push to main builds, deploys and verifies automancer.uk.
#
# There is no CI run on main: a merge can produce a tree no pull request
# tested. The build job builds this exact commit once, with production's
# settings, then runs lint, typecheck and the whole dist/ audit on those bytes
# before uploading them. The deploy job signs and verifies that archive
# before GitHub Pages publishes it.
#
# Every `uses:` below is pinned to a full commit SHA, with the human-readable
# version in a trailing comment. Version tags are mutable upstream, so the pin
# is what guarantees this workflow runs the code we reviewed - it holds
# `pages: write` and `id-token: write`. Dependabot's github-actions ecosystem
# (.github/dependabot.yml) refreshes both the SHA and the comment.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job can publish to Pages, mint an OIDC token or write
# attestations. The build and journey jobs install third-party packages.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Bound stalled npm registry requests to about two minutes including retries.
  npm_config_fetch_timeout: "20000"
  npm_config_fetch_retries: "4"
  npm_config_fetch_retry_mintimeout: "2000"
  npm_config_fetch_retry_maxtimeout: "10000"

jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    outputs:
      pages-artifact-id: ${{ steps.pages-artifact.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan commit history for secrets
        run: |
          scan_dir=$(mktemp -d)
          trap 'rm -rf "$scan_dir"' EXIT
          curl --fail --silent --show-error --location --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          # HEAD excludes unrelated PR refs; -m also scans merge-resolution diffs.
          "$scan_dir/gitleaks" git --redact --config .gitleaks.toml --log-opts="HEAD -m"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # Its self-install runs `npm install`, whose audit call can hang 5 minutes (t6452).
        env:
          npm_config_audit: "false"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        # Sourced from the repository Actions variable (populated from BWS
        # AUT_SENTRY_WEB_DSN). Astro/Vite only exposes PUBLIC_* values to the
        # browser bundle, so this makes production Pages builds observable
        # without placing a DSN in the repository or local dotenv files.
        # The release tags each Sentry event with the commit that served it.
        #
        # SERVED_PAGES_URL is the page index production serves now: a page
        # whose words this build leaves unchanged keeps the date it publishes
        # (src/integrations/page-dates.ts). The query only defeats caches. If
        # production cannot be read, pages keep their built dates.
        env:
          PUBLIC_AUT_SENTRY_WEB_DSN: ${{ vars.PUBLIC_AUT_SENTRY_WEB_DSN }}
          PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
          SERVED_PAGES_URL: https://automancer.uk/api/pages.json?for=${{ github.sha }}

      # The pull request's verdict, run on the bytes this job uploads (the
      # audit reads the dist/ above instead of building its own).
      - name: Lint, typecheck and audit the build that ships
        run: pnpm run lint && pnpm run typecheck && SKIP_BUILD=1 pnpm run test

      - name: Upload artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          # The action drops dot-prefixed paths by default, which is why
          # /.well-known/ answered 404 in production. GitHub Pages serves them.
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    # A healthy deploy and verify finish in under a minute. The cap only stops a
    # stuck job; it never cancels an honest run.
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the audited Pages archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.pages-artifact-id }}
          path: ${{ runner.temp }}/pages

      - name: Sign the Pages archive
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/pages/artifact.tar

      - name: Verify the archive and its source commit
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          gh attestation verify "$RUNNER_TEMP/pages/artifact.tar" \
            --bundle "$PROVENANCE_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deploy.yml" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Verification against PRODUCTION ITSELF: deploy-pages only proves GitHub
      # accepted the artifact. This fails the run unless every page answers,
      # unknown paths are a real 404, the machine surfaces and legal footer are
      # served, TLS is valid, and production serves this run's exact revision.
      # The assertions are shared with the 30-minute host monitor (docs/DEPLOYMENT.md).
      - name: Verify production serves the new deploy
        run: ops/verify-production.sh --expected-revision "$GITHUB_SHA" https://automancer.uk

  # The visitor journey against production itself, read-only: the enquiry
  # endpoint and Turnstile are stubbed, so nothing is sent. Its own job, with
  # neither pages: write nor id-token, because it runs `pnpm install`.
  journey:
    needs: deploy
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        env:
          npm_config_audit: "false"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the journey browser
        # The browser alone: the hosted image has its libraries, and apt's
        # mirror could add 8 minutes (ci.yml, t25593).
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Visitor journey against production
        run: pnpm run journey
        env:
          JOURNEY_URL: https://automancer.uk
